<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>A Royal Celebration — Ananya & Arjun</title>

  <!-- Google Fonts: Cormorant Garamond, Cinzel, Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & RESET
       ========================================================================== */
    :root {
      --color-ivory: #FFF8E7;
      --color-pearl: #F8F5EF;
      --color-gold: #C5A15B;
      --color-gold-muted: #AA8950;
      --color-maroon: #701F2D;
      --color-brown: #382820;
      --color-night: #120B09;

      --font-heading: 'Cormorant Garamond', Georgia, serif;
      --font-royal: 'Cinzel', serif;
      --font-body: 'Montserrat', sans-serif;

      --ease-cinematic: cubic-bezier(0.22, 1, 0.36, 1);
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 24px);
      --safe-left: env(safe-area-inset-left, 20px);
      --safe-right: env(safe-area-inset-right, 20px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--color-night);
      color: var(--color-ivory);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: fixed;
      inset: 0;
    }

    /* ==========================================================================
       2. VIEWPORT STAGE & VIDEO LAYER
       ========================================================================== */
    #app-stage {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--color-night);
    }

    /* Fullscreen Video Element */
    #scene-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.9s var(--ease-cinematic);
      pointer-events: none;
    }

    #scene-video.visible {
      opacity: 1;
    }

    /* Procedural Royal Palace Fallback Canvas (Active when placeholder MP4 is absent) */
    #fallback-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.9s var(--ease-cinematic);
      pointer-events: none;
    }

    #fallback-canvas.visible {
      opacity: 1;
    }

    /* Ambient Floating Petals / Golden Dust Canvas */
    #ambient-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      opacity: 0.75;
    }

    /* Subtle Cinematic Scrim (Protects typography without hiding video art) */
    .cinematic-scrim {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(18, 11, 9, 0.38) 0%,
        rgba(18, 11, 9, 0.08) 35%,
        rgba(18, 11, 9, 0.25) 62%,
        rgba(18, 11, 9, 0.82) 100%
      );
      opacity: 0;
      transition: opacity 1.2s var(--ease-cinematic);
    }

    .cinematic-scrim.text-phase {
      opacity: 1;
    }

    /* ==========================================================================
       3. OPENING SCREEN (POSTER GATE)
       ========================================================================== */
    #opening-screen {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(var(--safe-top) + 36px) 24px calc(var(--safe-bottom) + 36px);
      text-align: center;
      background:
        radial-gradient(circle at 50% 28%, rgba(197, 161, 91, 0.22) 0%, rgba(112, 31, 45, 0.45) 48%, rgba(18, 11, 9, 0.96) 100%),
        var(--color-night);
      background-size: cover;
      background-position: center;
      transition: opacity 1.1s var(--ease-cinematic), visibility 1.1s;
    }

    #opening-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Architectural Jharokha Arch Outline on Opening Poster */
    .palace-arch-frame {
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(197, 161, 91, 0.28);
      pointer-events: none;
      z-index: -1;
    }

    .palace-arch-frame::before {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(197, 161, 91, 0.12);
    }

    .monogram-crest {
      width: clamp(72px, 14vw, 96px);
      height: auto;
      margin-top: 2vh;
      filter: drop-shadow(0 4px 20px rgba(197, 161, 91, 0.25));
      animation: gentleFloat 5s ease-in-out infinite alternate;
    }

    .opening-center {
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .royal-eyebrow {
      font-family: var(--font-royal);
      font-size: clamp(0.75rem, 2.2vw, 0.92rem);
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--color-gold);
    }

    .opening-title {
      font-family: var(--font-royal);
      font-weight: 500;
      font-size: clamp(1.65rem, 5.5vw, 2.75rem);
      letter-spacing: 0.16em;
      line-height: 1.25;
      color: var(--color-ivory);
      text-shadow: 0 4px 28px rgba(0, 0, 0, 0.65);
    }

    .opening-subtitle {
      font-family: var(--font-heading);
      font-style: italic;
      font-size: clamp(1.2rem, 3.8vw, 1.6rem);
      color: var(--color-pearl);
      opacity: 0.9;
      letter-spacing: 0.03em;
    }

    .ornamental-divider {
      width: 140px;
      height: 18px;
      margin: 6px 0;
      opacity: 0.85;
    }

    .opening-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .tap-instruction {
      font-family: var(--font-body);
      font-size: 0.68rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(248, 245, 239, 0.6);
    }

    /* ==========================================================================
       4. MINIMAL TOP HUD (PROGRESS, PREV, AUDIO)
       ========================================================================== */
    #top-hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      padding: calc(var(--safe-top) + 14px) calc(var(--safe-right) + 20px) 14px calc(var(--safe-left) + 20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s var(--ease-cinematic);
    }

    #top-hud.active {
      opacity: 1;
      pointer-events: auto;
    }

    .hud-btn {
      background: none;
      border: none;
      color: var(--color-ivory);
      font-family: var(--font-royal);
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 4px;
      cursor: pointer;
      opacity: 0.78;
      transition: opacity 0.3s ease, color 0.3s ease;
    }

    .hud-btn:hover, .hud-btn:focus-visible {
      opacity: 1;
      color: var(--color-gold);
      outline: none;
    }

    .hud-btn.hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .hud-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }

    /* Minimal Scene Progress Dots / Bar */
    .scene-progress {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-segment {
      width: clamp(14px, 3.2vw, 24px);
      height: 1.5px;
      background: rgba(255, 248, 231, 0.22);
      transition: background-color 0.6s ease, transform 0.6s ease;
    }

    .progress-segment.completed {
      background: rgba(197, 161, 91, 0.6);
    }

    .progress-segment.current {
      background: var(--color-gold);
      transform: scaleY(1.8);
      box-shadow: 0 0 8px rgba(197, 161, 91, 0.6);
    }

    /* ==========================================================================
       5. SCENE TYPOGRAPHY OVERLAY (REVEALED ONLY AFTER VIDEO ENDS)
       ========================================================================== */
    #scene-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      text-align: center;
      padding: calc(var(--safe-top) + 64px) 24px calc(var(--safe-bottom) + 38px);
      pointer-events: none;
    }

    /* Scene 03 special positioning: Couple stands lower-middle, keep upper/clean space balanced */
    #scene-overlay.layout-couple {
      justify-content: space-between;
      padding-top: calc(var(--safe-top) + 68px);
    }

    .overlay-content {
      max-width: 640px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Staggered Reveal Animation States */
    .reveal-item {
      opacity: 0;
      transform: translateY(18px);
      transition:
        opacity 1.05s var(--ease-cinematic),
        transform 1.05s var(--ease-cinematic);
    }

    .reveal-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .scene-eyebrow {
      font-family: var(--font-royal);
      font-size: clamp(0.68rem, 1.9vw, 0.82rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--color-gold);
      margin-bottom: 2px;
    }

    .scene-heading {
      font-family: var(--font-heading);
      font-weight: 400;
      font-size: clamp(2rem, 6.2vw, 3.35rem);
      line-height: 1.14;
      color: var(--color-ivory);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.75);
      letter-spacing: 0.01em;
    }

    .scene-supporting {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: clamp(0.88rem, 2.5vw, 1.05rem);
      line-height: 1.65;
      color: var(--color-pearl);
      max-width: 460px;
      opacity: 0.92;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8);
    }

    /* Royal Couple Names Display (Scene 03) */
    .couple-names-block {
      margin: 8px 0 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .royal-name {
      font-family: var(--font-royal);
      font-weight: 500;
      font-size: clamp(1.65rem, 5.6vw, 2.75rem);
      letter-spacing: 0.18em;
      color: var(--color-ivory);
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.85);
    }

    .royal-ampersand {
      font-family: var(--font-heading);
      font-style: italic;
      font-size: clamp(1.35rem, 4vw, 1.9rem);
      color: var(--color-gold);
      line-height: 1;
      margin: 2px 0;
    }

    .royal-meta {
      font-family: var(--font-royal);
      font-size: clamp(0.82rem, 2.4vw, 1rem);
      letter-spacing: 0.28em;
      color: var(--color-gold);
      margin-top: 6px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
    }

    .venue-location-sub {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: clamp(0.75rem, 2.1vw, 0.88rem);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--color-pearl);
      opacity: 0.85;
    }

    /* Scene 05 Sub-Event Progress Indicator */
    .event-step-indicator {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .event-pip {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 248, 231, 0.3);
      transition: all 0.4s ease;
    }

    .event-pip.active {
      background: var(--color-gold);
      transform: scale(1.35);
      box-shadow: 0 0 8px var(--color-gold);
    }

    /* ==========================================================================
       6. LUXURY CINEMATIC BUTTONS (NO HEAVY BOXES)
       ========================================================================== */
    .action-area {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      pointer-events: auto;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px 24px;
    }

    .btn-cinematic {
      position: relative;
      background: rgba(18, 11, 9, 0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--color-ivory);
      font-family: var(--font-royal);
      font-size: clamp(0.76rem, 2.1vw, 0.86rem);
      font-weight: 500;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      padding: 15px 36px;
      border: none;
      border-top: 1px solid rgba(197, 161, 91, 0.65);
      border-bottom: 1px solid rgba(197, 161, 91, 0.65);
      cursor: pointer;
      transition:
        background-color 0.4s ease,
        color 0.4s ease,
        border-color 0.4s ease,
        box-shadow 0.4s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 210px;
    }

    .btn-cinematic::before,
    .btn-cinematic::after {
      content: "❖";
      font-size: 0.55rem;
      color: var(--color-gold);
      opacity: 0.8;
      transition: transform 0.4s ease;
    }

    .btn-cinematic:hover,
    .btn-cinematic:focus-visible {
      background: rgba(112, 31, 45, 0.55);
      border-color: var(--color-gold);
      color: var(--color-ivory);
      box-shadow: 0 0 28px rgba(197, 161, 91, 0.22);
      outline: none;
    }

    .btn-cinematic.btn-primary-maroon {
      background: rgba(112, 31, 45, 0.72);
      border-top: 1px solid var(--color-gold);
      border-bottom: 1px solid var(--color-gold);
    }

    .btn-cinematic.btn-secondary-minimal {
      background: transparent;
      backdrop-filter: none;
      border-top: 1px solid rgba(197, 161, 91, 0.35);
      border-bottom: 1px solid rgba(197, 161, 91, 0.35);
      padding: 12px 24px;
      min-width: 175px;
      font-size: 0.73rem;
    }

    /* ==========================================================================
       7. LOADING INDICATOR & PLAYBACK STATUS
       ========================================================================== */
    #video-loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #video-loader.active {
      opacity: 1;
    }

    .gold-spinner {
      width: 38px;
      height: 38px;
      border: 1.5px solid rgba(197, 161, 91, 0.2);
      border-top-color: var(--color-gold);
      border-radius: 50%;
      animation: spin 1.1s linear infinite;
    }

    /* Subtle indicator while video is actively playing */
    #playback-hint {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 14px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      font-family: var(--font-royal);
      font-size: 0.62rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 248, 231, 0.42);
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    #playback-hint.visible {
      opacity: 1;
    }

    /* ==========================================================================
       8. ELEGANT FULLSCREEN RSVP OVERLAY
       ========================================================================== */
    #rsvp-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(18, 11, 9, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: calc(var(--safe-top) + 24px) 24px calc(var(--safe-bottom) + 24px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s var(--ease-cinematic), visibility 0.6s;
    }

    #rsvp-modal.open {
      opacity: 1;
      visibility: visible;
    }

    .rsvp-container {
      width: 100%;
      max-width: 440px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .rsvp-close {
      position: absolute;
      top: calc(var(--safe-top) + 18px);
      right: calc(var(--safe-right) + 22px);
      background: none;
      border: none;
      color: var(--color-gold);
      font-family: var(--font-royal);
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 8px;
    }

    .rsvp-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: left;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-family: var(--font-royal);
      font-size: 0.68rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--color-gold);
    }

    .field-input,
    .field-select {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(197, 161, 91, 0.45);
      padding: 10px 2px;
      color: var(--color-ivory);
      font-family: var(--font-heading);
      font-size: 1.25rem;
      outline: none;
      transition: border-color 0.3s ease;
      border-radius: 0;
    }

    .field-input::placeholder {
      color: rgba(248, 245, 239, 0.35);
      font-style: italic;
    }

    .field-input:focus,
    .field-select:focus {
      border-bottom-color: var(--color-gold);
    }

    .field-select option {
      background: var(--color-night);
      color: var(--color-ivory);
      font-family: var(--font-body);
      font-size: 0.95rem;
    }

    .rsvp-status-msg {
      font-family: var(--font-heading);
      font-style: italic;
      font-size: 1.15rem;
      color: var(--color-gold);
      line-height: 1.5;
      min-height: 1.6em;
      text-align: center;
    }

    /* ==========================================================================
       9. ANIMATIONS & REDUCED MOTION
       ========================================================================== */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes gentleFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      #scene-overlay {
        padding-top: 48px;
        padding-bottom: 18px;
      }
      .scene-heading {
        font-size: clamp(1.5rem, 4.5vw, 2.2rem);
      }
      .action-area {
        margin-top: 10px;
      }
      .btn-cinematic {
        padding: 10px 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.2s !important;
      }
      .reveal-item {
        transform: none !important;
      }
    }
  </style>
</head>

  <!-- ========================================================================
       INTERACTION ENGINE & CINEMATIC CONTROLLER
       ======================================================================== -->
  <script>
    (function () {
      "use strict";

      /* ----------------------------------------------------------------------
         1. ENGINE STATE
         ---------------------------------------------------------------------- */
      const state = {
        hasStarted: false,
        sceneIndex: 0,       // 0 to 6 (7 scenes)
        eventIndex: 0,       // 0 to 3 (for Scene 05's 4 events)
        isPlayingVideo: false,
        isTextRevealed: false,
        isMuted: false,
        usingFallback: false,
        revealTimer: null,
        fallbackAnimFrame: null,
        fallbackStartTime: 0,
        fallbackDuration: 6000,
        currentFallbackTheme: "sunrise-palace",
        synthAudioCtx: null,
        synthGainNode: null
      };

      /* ----------------------------------------------------------------------
         2. DOM REFERENCES
         ---------------------------------------------------------------------- */
      const dom = {
        openingScreen: document.getElementById("opening-screen"),
        openEyebrow: document.getElementById("open-eyebrow"),
        openCoupleNames: document.getElementById("open-couple-names"),
        openSubtitle: document.getElementById("open-subtitle"),
        openInstruction: document.getElementById("open-instruction"),
        btnBegin: document.getElementById("btn-begin"),

        video: document.getElementById("scene-video"),
        preloader: document.getElementById("next-video-preloader"),
        fallbackCanvas: document.getElementById("fallback-canvas"),
        ambientCanvas: document.getElementById("ambient-canvas"),
        scrim: document.getElementById("cinematic-scrim"),
        loader: document.getElementById("video-loader"),
        playbackHint: document.getElementById("playback-hint"),

        topHud: document.getElementById("top-hud"),
        btnPrev: document.getElementById("btn-prev"),
        btnAudio: document.getElementById("btn-audio"),
        iconSoundOn: document.getElementById("icon-sound-on"),
        iconSoundOff: document.getElementById("icon-sound-off"),
        audioLabel: document.getElementById("audio-label"),
        progressContainer: document.getElementById("scene-progress"),

        overlay: document.getElementById("scene-overlay"),
        bgMusic: document.getElementById("bg-music"),

        rsvpModal: document.getElementById("rsvp-modal"),
        btnCloseRsvp: document.getElementById("btn-close-rsvp"),
        rsvpForm: document.getElementById("rsvp-form"),
        rsvpStatus: document.getElementById("rsvp-status")
      };

      /* ----------------------------------------------------------------------
         3. INITIALIZE OPENING SCREEN & HUD FROM CONFIG
         ---------------------------------------------------------------------- */
      function initFromConfig() {
        const { couple, opening, scenes, audio } = weddingConfig;

        const brideFirst = couple.bride.split(" ")[0];
        const groomFirst = couple.groom.split(" ")[0];
        dom.openCoupleNames.innerHTML = `${brideFirst} <span style="color:var(--color-gold);font-family:var(--font-heading);font-style:italic;font-weight:400;">&amp;</span> ${groomFirst}`;
        dom.openEyebrow.textContent = opening.eyebrow;
        dom.openSubtitle.textContent = opening.subtitle;
        dom.btnBegin.textContent = opening.ctaText;
        dom.openInstruction.textContent = opening.instruction;

        // Apply opening poster if image exists, keeping rich architectural gradient fallback
        if (opening.poster) {
          const img = new Image();
          img.onload = () => {
            dom.openingScreen.style.backgroundImage = `
              radial-gradient(circle at 50% 28%, rgba(18, 11, 9, 0.35) 0%, rgba(18, 11, 9, 0.88) 100%),
              url('${opening.poster}')
            `;
          };
          img.src = opening.poster;
        }

        // Build 7-segment progress indicator
        dom.progressContainer.innerHTML = "";
        scenes.forEach((_, idx) => {
          const seg = document.createElement("span");
          seg.className = "progress-segment";
          seg.dataset.index = idx;
          dom.progressContainer.appendChild(seg);
        });

        // Configure audio element source
        if (audio && audio.src) {
          dom.bgMusic.src = audio.src;
          dom.bgMusic.volume = audio.volume || 0.45;
        }

        initAmbientParticles();
      }

      /* ----------------------------------------------------------------------
         4. AUDIO MANAGER (RESPECTS USER INTERACTION & GRACEFUL FALLBACK)
         ---------------------------------------------------------------------- */
      function startBackgroundAudio() {
        if (!dom.bgMusic.src) {
          startAmbientPadFallback();
          return;
        }

        const playPromise = dom.bgMusic.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // If placeholder MP3 file is missing, synthesize a gentle warm royal tanpura/drone pad
            startAmbientPadFallback();
          });
        }
      }

      function startAmbientPadFallback() {
        try {
          if (state.synthAudioCtx) return;
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;

          const ctx = new AudioContext();
          const masterGain = ctx.createGain();
          masterGain.gain.setValueAtTime(0.001, ctx.currentTime);
          masterGain.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + 2.5);
          masterGain.connect(ctx.destination);

          // Warm Sa-Pa-Sa Indian Classical Royal Tanpura Drone Frequencies (C3, G3, C4, E4)
          const freqs = [130.81, 196.00, 261.63, 329.63];
          freqs.forEach((f, i) => {
            const osc = ctx.createOscillator();
            const oscGain = ctx.createGain();
            osc.type = i % 2 === 0 ? "sine" : "triangle";
            osc.frequency.setValueAtTime(f, ctx.currentTime);
            oscGain.gain.setValueAtTime(i === 3 ? 0.08 : 0.22, ctx.currentTime);
            osc.connect(oscGain);
            oscGain.connect(masterGain);
            osc.start();
          });

          state.synthAudioCtx = ctx;
          state.synthGainNode = masterGain;
        } catch (err) {
          // Audio failed silently without breaking experience
        }
      }

      function toggleAudio() {
        state.isMuted = !state.isMuted;
        dom.bgMusic.muted = state.isMuted;

        if (state.synthGainNode && state.synthAudioCtx) {
          const target = state.isMuted ? 0.0001 : 0.06;
          state.synthGainNode.gain.setTargetAtTime(target, state.synthAudioCtx.currentTime, 0.25);
        }

        dom.iconSoundOn.style.display = state.isMuted ? "none" : "block";
        dom.iconSoundOff.style.display = state.isMuted ? "block" : "none";
        dom.audioLabel.textContent = state.isMuted ? "MUTED" : "SOUND ON";
      }

      /* ----------------------------------------------------------------------
         5. SCENE & EVENT DATA RESOLVER
         ---------------------------------------------------------------------- */
      function getActiveClipConfig() {
        const scene = weddingConfig.scenes[state.sceneIndex];
        if (scene.events && Array.isArray(scene.events)) {
          const ev = scene.events[state.eventIndex];
          return {
            sceneId: scene.id,
            isMultiEvent: true,
            eventIndex: state.eventIndex,
            totalEvents: scene.events.length,
            eyebrow: scene.eyebrow || "ROYAL CELEBRATIONS",
            heading: ev.title,
            datetime: ev.datetime,
            video: ev.video,
            poster: ev.poster || "",
            fallbackTheme: ev.fallbackTheme || "haldi-courtyard",
            durationFallbackMs: ev.durationFallbackMs || 5500,
            continueLabel: ev.continueLabel || "CONTINUE"
          };
        }
        return {
          ...scene,
          sceneId: scene.id,
          isMultiEvent: false
        };
      }

      function getNextClipVideoUrl() {
        const scene = weddingConfig.scenes[state.sceneIndex];
        if (scene.events && state.eventIndex + 1 < scene.events.length) {
          return scene.events[state.eventIndex + 1].video;
        }
        if (state.sceneIndex + 1 < weddingConfig.scenes.length) {
          const nextScene = weddingConfig.scenes[state.sceneIndex + 1];
          if (nextScene.events && nextScene.events.length > 0) {
            return nextScene.events[0].video;
          }
          return nextScene.video;
        }
        return null;
      }

      /* ----------------------------------------------------------------------
         6. CORE PLAYBACK & FINAL-FRAME FREEZE ENGINE
         ---------------------------------------------------------------------- */
      function loadAndPlayCurrentClip() {
        clearTimeout(state.revealTimer);
        cancelAnimationFrame(state.fallbackAnimFrame);

        state.isPlayingVideo = true;
        state.isTextRevealed = false;
        state.usingFallback = false;

        // Clear previous overlay text immediately
        dom.overlay.innerHTML = "";
        dom.overlay.className = "";
        dom.scrim.classList.remove("text-phase");
        dom.playbackHint.classList.add("visible");

        updateHudState();

        const clip = getActiveClipConfig();
        if (clip.layout === "couple") {
          dom.overlay.classList.add("layout-couple");
        }

        // Prepare HTML5 Video
        dom.loader.classList.add("active");
        dom.fallbackCanvas.classList.remove("visible");

        const videoEl = dom.video;
        videoEl.pause();
        videoEl.removeAttribute("src");
        if (clip.poster) {
          videoEl.setAttribute("poster", clip.poster);
        } else {
          videoEl.removeAttribute("poster");
        }

        videoEl.src = clip.video;
        videoEl.load();

        let fallbackTriggered = false;
        const triggerProceduralFallback = () => {
          if (fallbackTriggered) return;
          fallbackTriggered = true;
          dom.loader.classList.remove("active");
          videoEl.classList.remove("visible");
          runProceduralPalaceScene(clip);
        };

        const onCanPlay = () => {
          cleanupVideoListeners();
          dom.loader.classList.remove("active");
          videoEl.classList.add("visible");

          const playPromise = videoEl.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              triggerProceduralFallback();
            });
          }
          preloadNextVideo();
        };

        const onError = () => {
          cleanupVideoListeners();
          triggerProceduralFallback();
        };

        function cleanupVideoListeners() {
          videoEl.removeEventListener("canplay", onCanPlay);
          videoEl.removeEventListener("error", onError);
        }

        videoEl.addEventListener("canplay", onCanPlay, { once: true });
        videoEl.addEventListener("error", onError, { once: true });
      }

      // Listen strictly to HTML5 Video 'ended' event to freeze last frame and reveal text
      dom.video.addEventListener("ended", () => {
        if (!state.isPlayingVideo || state.usingFallback) return;
        handleClipCompletion();
      });

      function handleClipCompletion() {
        state.isPlayingVideo = false;
        dom.playbackHint.classList.remove("visible");

        // IMPORTANT: Keep video visible on its actual final frame (do not reset currentTime or hide video)
        dom.scrim.classList.add("text-phase");

        // Reveal typography and CONTINUE action 500ms after video completion
        state.revealTimer = setTimeout(() => {
          renderSceneOverlay(getActiveClipConfig());
        }, 500);
      }

      function preloadNextVideo() {
        const nextUrl = getNextClipVideoUrl();
        if (nextUrl && dom.preloader.src !== nextUrl) {
          dom.preloader.src = nextUrl;
          dom.preloader.load();
        }
      }

      /* ----------------------------------------------------------------------
         7. PROCEDURAL ROYAL PALACE CINEMA FALLBACK
         (Simulates camera movement, marble arches, golden lamps & freezes on final frame
          when placeholder .mp4 files are not yet placed in assets/videos/)
         ---------------------------------------------------------------------- */
      function runProceduralPalaceScene(clip) {
        state.usingFallback = true;
        const canvas = dom.fallbackCanvas;
        const ctx = canvas.getContext("2d");

        function resize() {
          canvas.width = window.innerWidth * Math.min(window.devicePixelRatio || 1, 2);
          canvas.height = window.innerHeight * Math.min(window.devicePixelRatio || 1, 2);
        }
        resize();

        canvas.classList.add("visible");
        state.fallbackStartTime = performance.now();
        state.fallbackDuration = clip.durationFallbackMs || 6000;
        state.currentFallbackTheme = clip.fallbackTheme || "sunrise-palace";

        function renderFrame(now) {
          const elapsed = now - state.fallbackStartTime;
          const progress = Math.min(elapsed / state.fallbackDuration, 1);
          // Smooth cinematic camera push-in curve
          const easeProgress = 1 - Math.pow(1 - progress, 3);

          drawPalaceSceneArt(ctx, canvas.width, canvas.height, state.currentFallbackTheme, easeProgress);

          if (progress < 1) {
            state.fallbackAnimFrame = requestAnimationFrame(renderFrame);
          } else {
            // Freeze on final rendered frame & trigger HTML5 video ended equivalent
            handleClipCompletion();
          }
        }

        state.fallbackAnimFrame = requestAnimationFrame(renderFrame);
      }

      function drawPalaceSceneArt(ctx, w, h, theme, t) {
        ctx.save();

        // Palette selection per scene direction
        const palettes = {
          "sunrise-palace": ["#2A1517", "#701F2D", "#C5A15B", "#FFF8E7"],
          "corridor-arches": ["#1E1210", "#4A1C24", "#C5A15B", "#F8F5EF"],
          "courtyard-couple": ["#231316", "#651C2A", "#D4AF37", "#FFF8E7"],
          "palace-garden": ["#131E19", "#2E4035", "#C5A15B", "#FFF8E7"],
          "haldi-courtyard": ["#33220B", "#7A4912", "#E6B422", "#FFF8E7"],
          "mehendi-garden": ["#112218", "#234430", "#C5A15B", "#F8F5EF"],
          "sangeet-ballroom": ["#140D18", "#3B1830", "#D4AF37", "#FFF8E7"],
          "wedding-mandap": ["#2B0F16", "#701F2D", "#C5A15B", "#FFF8E7"],
          "aerial-palace": ["#1F1418", "#582430", "#C5A15B", "#FFF8E7"],
          "night-illuminated-palace": ["#0B0708", "#2B1318", "#D4AF37", "#FFF8E7"]
        };

        const pal = palettes[theme] || palettes["sunrise-palace"];

        // 1. Background Sky / Ambient Palace Glow
        const grad = ctx.createRadialGradient(
          w * 0.5, h * (0.38 - t * 0.05), w * 0.05,
          w * 0.5, h * 0.5, Math.max(w, h) * 0.85
        );
        grad.addColorStop(0, pal[2]);
        grad.addColorStop(0.38, pal[1]);
        grad.addColorStop(1, pal[0]);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // 2. Slow Cinematic Camera Zoom Transform
        const scale = 1 + t * 0.16;
        ctx.translate(w / 2, h / 2);
        ctx.scale(scale, scale);
        ctx.translate(-w / 2, -h / 2);

        // 3. Distant Marble Palace Domes & Chhatris
        ctx.strokeStyle = "rgba(255, 248, 231, 0.22)";
        ctx.lineWidth = Math.max(1.5, w * 0.0018);

        const horizonY = h * 0.62;
        ctx.beginPath();
        ctx.moveTo(0, horizonY);
        ctx.lineTo(w, horizonY);
        ctx.stroke();

        // Central Royal Dome Silhouette
        ctx.fillStyle = "rgba(18, 11, 9, 0.42)";
        ctx.beginPath();
        ctx.arc(w * 0.5, horizonY - h * 0.12, w * 0.14, Math.PI, 0);
        ctx.lineTo(w * 0.64, horizonY);
        ctx.lineTo(w * 0.36, horizonY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 4. Rajasthani Cusped Marble Archway (Foreground Framing)
        ctx.strokeStyle = "rgba(197, 161, 91, 0.52)";
        ctx.lineWidth = Math.max(2, w * 0.0025);
        const archMarginX = w * 0.12;
        const archTopY = h * 0.14;
        ctx.strokeRect(archMarginX, archTopY, w - archMarginX * 2, h - archTopY * 1.4);

        // Hanging Marigold Garlands (Torans)
        const garlandCount = 5;
        const spanW = (w - archMarginX * 2) / garlandCount;
        ctx.strokeStyle = "rgba(235, 145, 45, 0.55)";
        for (let i = 0; i < garlandCount; i++) {
          const startX = archMarginX + i * spanW;
          ctx.beginPath();
          ctx.moveTo(startX, archTopY);
          ctx.quadraticCurveTo(startX + spanW * 0.5, archTopY + h * 0.08, startX + spanW, archTopY);
          ctx.stroke();
        }

        // 5. Couple Silhouette in Scene 03 & Scene 04
        if (theme === "courtyard-couple" || theme === "palace-garden") {
          const cx = w * 0.5;
          const cy = h * 0.61;
          ctx.fillStyle = "rgba(255, 248, 231, 0.25)";
          // Groom & Bride graceful minimal silhouettes in lower-middle frame
          ctx.beginPath();
          ctx.arc(cx - w * 0.025, cy - h * 0.07, h * 0.018, 0, Math.PI * 2);
          ctx.arc(cx + w * 0.025, cy - h * 0.062, h * 0.016, 0, Math.PI * 2);
          ctx.fill();
        }

        // 6. Warm Golden Diya / Lantern Reflections on Polished Marble Floor
        for (let i = 0; i < 9; i++) {
          const lx = w * (0.18 + i * 0.08);
          const ly = horizonY + h * 0.06 + Math.sin(i * 1.7 + t * 4) * 8;
          const lampGlow = ctx.createRadialGradient(lx, ly, 1, lx, ly, w * 0.045);
          lampGlow.addColorStop(0, "rgba(255, 230, 160, 0.65)");
          lampGlow.addColorStop(1, "rgba(197, 161, 91, 0)");
          ctx.fillStyle = lampGlow;
          ctx.beginPath();
          ctx.arc(lx, ly, w * 0.045, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      /* ----------------------------------------------------------------------
         8. RENDER FINAL-FRAME TYPOGRAPHY & ACTION CONTROLS
         ---------------------------------------------------------------------- */
      function renderSceneOverlay(clip) {
        state.isTextRevealed = true;
        const { couple, venue } = weddingConfig;

        let html = `<div class="overlay-content">`;

        // Scene 05 Event Step Pips
        if (clip.isMultiEvent) {
          let pipsHtml = `<div class="event-step-indicator reveal-item" data-delay="0">`;
          for (let i = 0; i < clip.totalEvents; i++) {
            pipsHtml += `<span class="event-pip ${i === clip.eventIndex ? "active" : ""}"></span>`;
          }
          pipsHtml += `</div>`;
          html += pipsHtml;
        }

        // Eyebrow
        if (clip.eyebrow) {
          html += `<p class="scene-eyebrow reveal-item" data-delay="60">${clip.eyebrow}</p>`;
        }

        // Main Heading
        if (clip.heading) {
          html += `<h2 class="scene-heading reveal-item" data-delay="140">${clip.heading}</h2>`;
        }

        // Scene 03: Couple Names & Wedding Date from Central Config
        if (clip.showCoupleDetails) {
          html += `
            <div class="couple-names-block reveal-item" data-delay="280">
              <div class="royal-name">${couple.bride}</div>
              <div class="royal-ampersand">&amp;</div>
              <div class="royal-name">${couple.groom}</div>
              <div class="royal-meta">${couple.date}</div>
            </div>
          `;
        }

        // Scene 05: Event Date & Time
        if (clip.datetime) {
          html += `<p class="royal-meta reveal-item" data-delay="260">${clip.datetime}</p>`;
        }

        // Scene 06: Destination Venue Details
        if (clip.showVenueDetails) {
          html += `
            <div class="couple-names-block reveal-item" data-delay="260">
              <div class="royal-name" style="font-size:clamp(1.35rem, 4.5vw, 2.2rem);">${venue.name}</div>
              <div class="venue-location-sub">${venue.city}</div>
            </div>
          `;
        }

        // Supporting Text
        if (clip.supporting) {
          html += `<p class="scene-supporting reveal-item" data-delay="300">${clip.supporting}</p>`;
        }

        // Action Buttons Area
        html += `<div class="action-area reveal-item" data-delay="520">`;

        if (clip.showVenueDetails) {
          html += `
            <div class="action-row">
              <a href="${venue.mapUrl}" target="_blank" rel="noopener noreferrer" class="btn-cinematic btn-secondary-minimal">
                VIEW LOCATION
              </a>
              <button type="button" id="btn-continue" class="btn-cinematic btn-primary-maroon">
                ${clip.continueLabel || "CONTINUE"}
              </button>
            </div>
          `;
        } else if (clip.isFinalScene) {
          html += `
            <div class="action-row">
              <button type="button" id="btn-rsvp-open" class="btn-cinematic btn-primary-maroon">
                RSVP NOW
              </button>
              <button type="button" id="btn-calendar" class="btn-cinematic btn-secondary-minimal">
                ADD TO CALENDAR
              </button>
            </div>
            <button type="button" id="btn-replay" class="hud-btn" style="margin-top:6px;">
              ↻ REPLAY EXPERIENCE
            </button>
          `;
        } else {
          html += `
            <button type="button" id="btn-continue" class="btn-cinematic">
              ${clip.continueLabel || "CONTINUE"}
            </button>
          `;
        }

        html += `</div></div>`;

        dom.overlay.innerHTML = html;

        // Trigger staggered fade-in and subtle upward movement
        const items = dom.overlay.querySelectorAll(".reveal-item");
        items.forEach((el) => {
          const delay = parseInt(el.dataset.delay || "0", 10);
          setTimeout(() => {
            el.classList.add("visible");
          }, delay);
        });

        // Bind Action Listeners
        const btnContinue = document.getElementById("btn-continue");
        if (btnContinue) {
          btnContinue.addEventListener("click", advanceToNextStep);
        }

        const btnRsvpOpen = document.getElementById("btn-rsvp-open");
        if (btnRsvpOpen) {
          btnRsvpOpen.addEventListener("click", openRsvpModal);
        }

        const btnCalendar = document.getElementById("btn-calendar");
        if (btnCalendar) {
          btnCalendar.addEventListener("click", downloadCalendarInvite);
        }

        const btnReplay = document.getElementById("btn-replay");
        if (btnReplay) {
          btnReplay.addEventListener("click", replayExperience);
        }
      }

      /* ----------------------------------------------------------------------
         9. NAVIGATION CONTROLLERS (CONTINUE, PREVIOUS, REPLAY)
         ---------------------------------------------------------------------- */
      function advanceToNextStep() {
        const currentScene = weddingConfig.scenes[state.sceneIndex];

        // If inside Scene 05 (multi-event scene), advance through all 4 events first
        if (currentScene.events && state.eventIndex + 1 < currentScene.events.length) {
          state.eventIndex += 1;
          loadAndPlayCurrentClip();
          return;
        }

        // Move to next main scene
        if (state.sceneIndex + 1 < weddingConfig.scenes.length) {
          state.sceneIndex += 1;
          state.eventIndex = 0;
          loadAndPlayCurrentClip();
        }
      }

      function goToPreviousStep() {
        const currentScene = weddingConfig.scenes[state.sceneIndex];

        if (currentScene.events && state.eventIndex > 0) {
          state.eventIndex -= 1;
          loadAndPlayCurrentClip();
          return;
        }

        if (state.sceneIndex > 0) {
          state.sceneIndex -= 1;
          const prevScene = weddingConfig.scenes[state.sceneIndex];
          state.eventIndex = prevScene.events ? prevScene.events.length - 1 : 0;
          loadAndPlayCurrentClip();
        }
      }

      function replayExperience() {
        clearTimeout(state.revealTimer);
        cancelAnimationFrame(state.fallbackAnimFrame);

        state.sceneIndex = 0;
        state.eventIndex = 0;
        state.isPlayingVideo = false;
        state.isTextRevealed = false;

        dom.overlay.innerHTML = "";
        dom.scrim.classList.remove("text-phase");
        dom.video.pause();
        dom.video.classList.remove("visible");
        dom.fallbackCanvas.classList.remove("visible");
        dom.topHud.classList.remove("active");
        dom.openingScreen.classList.remove("hidden");
      }

      function updateHudState() {
        const hasPrev = state.sceneIndex > 0 || state.eventIndex > 0;
        dom.btnPrev.classList.toggle("hidden", !hasPrev);

        const segments = dom.progressContainer.querySelectorAll(".progress-segment");
        segments.forEach((seg, idx) => {
          seg.classList.remove("completed", "current");
          if (idx < state.sceneIndex) {
            seg.classList.add("completed");
          } else if (idx === state.sceneIndex) {
            seg.classList.add("current");
          }
        });
      }

      /* ----------------------------------------------------------------------
         10. CALENDAR (.ICS / GOOGLE CALENDAR) & RSVP HANDLERS
         ---------------------------------------------------------------------- */
      function downloadCalendarInvite() {
        const { couple, venue } = weddingConfig;
        const title = `Royal Wedding: ${couple.bride} & ${couple.groom}`;
        const location = `${venue.name}, ${venue.city}`;
        const details = `Join us in celebrating the royal wedding of ${couple.bride} and ${couple.groom} at ${location}.`;

        const gCalUrl = new URL("https://calendar.google.com/calendar/render");
        gCalUrl.searchParams.set("action", "TEMPLATE");
        gCalUrl.searchParams.set("text", title);
        gCalUrl.searchParams.set("dates", `${couple.calendarStartISO}/${couple.calendarEndISO}`);
        gCalUrl.searchParams.set("details", details);
        gCalUrl.searchParams.set("location", location);

        window.open(gCalUrl.toString(), "_blank", "noopener,noreferrer");
      }

      function openRsvpModal() {
        dom.rsvpStatus.textContent = "";
        dom.rsvpModal.classList.add("open");
        dom.rsvpModal.setAttribute("aria-hidden", "false");
      }

      function closeRsvpModal() {
        dom.rsvpModal.classList.remove("open");
        dom.rsvpModal.setAttribute("aria-hidden", "true");
      }

      dom.rsvpForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
          guestName: document.getElementById("guest-name").value.trim(),
          guestCount: document.getElementById("guest-count").value,
          attendance: document.getElementById("guest-attendance").value,
          submittedAt: new Date().toISOString()
        };

        if (!payload.guestName) return;

        // Backend-ready dispatch
        if (weddingConfig.rsvp && weddingConfig.rsvp.endpoint) {
          dom.rsvpStatus.textContent = "Sending your response...";
          try {
            const res = await fetch(weddingConfig.rsvp.endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            if (res.ok) {
              dom.rsvpStatus.textContent = `Thank you, ${payload.guestName}. Your RSVP has been recorded.`;
              dom.rsvpForm.reset();
            } else {
              dom.rsvpStatus.textContent = "Unable to reach server. Please try again shortly.";
            }
          } catch (err) {
            dom.rsvpStatus.textContent = "Network error while submitting RSVP.";
          }
        } else {
          // Honest local preview confirmation when no backend endpoint is configured
          dom.rsvpStatus.textContent = `Thank you, ${payload.guestName}. Your response (${payload.guestCount} guest(s)) is prepared for this preview session. Connect 'weddingConfig.rsvp.endpoint' to store responses permanently.`;
        }
      });

      /* ----------------------------------------------------------------------
         11. SUBTLE FLOATING GOLDEN PARTICLES & MARIGOLD PETALS
         ---------------------------------------------------------------------- */
      function initAmbientParticles() {
        const canvas = dom.ambientCanvas;
        const ctx = canvas.getContext("2d");
        let w = (canvas.width = window.innerWidth);
        let h = (canvas.height = window.innerHeight);

        window.addEventListener("resize", () => {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        });

        const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (prefersReduced) return;

        const count = 22;
        const particles = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 2.2 + 0.8,
          vy: -(Math.random() * 0.25 + 0.08),
          vx: (Math.random() - 0.5) * 0.2,
          alpha: Math.random() * 0.45 + 0.15,
          isMarigold: Math.random() > 0.65
        }));

        function animateParticles() {
          ctx.clearRect(0, 0, w, h);
          for (const p of particles) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.y < -10) p.y = h + 10;
            if (p.x < -10) p.x = w + 10;
            if (p.x > w + 10) p.x = -10;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.isMarigold
              ? `rgba(235, 145, 45, ${p.alpha})`
              : `rgba(197, 161, 91, ${p.alpha})`;
            ctx.fill();
          }
          requestAnimationFrame(animateParticles);
        }

        requestAnimationFrame(animateParticles);
      }

      /* ----------------------------------------------------------------------
         12. EVENT LISTENERS & INITIALIZATION
         ---------------------------------------------------------------------- */
      dom.btnBegin.addEventListener("click", () => {
        if (state.hasStarted) return;
        state.hasStarted = true;

        // 1. Initialize music only on first user tap
        startBackgroundAudio();

        // 2. Fade out opening screen
        dom.openingScreen.classList.add("hidden");
        dom.topHud.classList.add("active");

        // 3. Start Scene 01
        state.sceneIndex = 0;
        state.eventIndex = 0;
        loadAndPlayCurrentClip();
      });

      dom.btnPrev.addEventListener("click", goToPreviousStep);
      dom.btnAudio.addEventListener("click", toggleAudio);
      dom.btnCloseRsvp.addEventListener("click", closeRsvpModal);

      initFromConfig();
    })();
  </script>
